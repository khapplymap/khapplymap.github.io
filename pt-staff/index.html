<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工讀排班管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:1050px;margin:auto;padding:24px 16px 48px}
h1{margin:0;font-size:30px}.sub{margin-top:6px;color:#6b7280}
.tabs{display:flex;gap:8px;margin:20px 0 16px}.tab{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}
.filters{display:grid;grid-template-columns:1fr 1fr 180px auto;gap:10px;align-items:end;margin-bottom:14px}
label{display:block;font-weight:700;margin:0 0 7px}
input,select{width:100%;height:46px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:15px;background:#fff}
button{height:46px;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer}
.summary{color:#6b7280;margin-bottom:12px;font-size:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 26px rgba(17,24,39,.05)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.place{font-size:21px;font-weight:800}.date{margin-top:4px;color:#6b7280}.count{font-weight:800}
.badge{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e5e7eb;font-size:14px}th{font-size:12px;color:#6b7280}
.empty{text-align:center;color:#6b7280;padding:24px}.preview-note{padding:12px 14px;border-radius:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:14px;font-weight:700}
.hidden{display:none}
@media(max-width:700px){.filters{grid-template-columns:1fr}.card{padding:14px}table{display:block;overflow-x:auto;white-space:nowrap}.tabs{overflow-x:auto}}
</style>
</head>
<body>
<main>
<h1>工讀排班管理</h1>
<div class="sub">正職人員／人資使用</div>

<div class="tabs">
  <button id="tabAttendance" class="tab active" onclick="switchTab('attendance')">出勤名單</button>
  <button id="tabPreview" class="tab" onclick="switchTab('preview')">18:15 排程預覽</button>
</div>

<section id="attendancePanel">
  <div class="filters">
    <div><label>日期</label><input id="dateFilter" placeholder="例如 10/5" oninput="renderAttendance()"></div>
    <div><label>學校</label><input id="placeFilter" placeholder="輸入學校名稱" oninput="renderAttendance()"></div>
    <div><label>狀態</label><select id="statusFilter" onchange="renderAttendance()"><option value="active">已報名／已公布</option><option value="cancelled">已取消</option><option value="all">全部</option></select></div>
    <button onclick="loadAll()">重新整理</button>
  </div>
  <div id="summary" class="summary">載入中…</div>
  <div id="attendanceList"><div class="card empty">載入資料中…</div></div>
</section>

<section id="previewPanel" class="hidden">
  <div class="preview-note">18:15 起會顯示隔日一般排程的系統建議分配；18:30 正式公布。此頁不顯示任何分配條件或能力標記。</div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
    <div id="previewSummary" class="summary" style="margin:0">載入中…</div>
    <button onclick="loadAll()">重新整理預覽</button>
  </div>
  <div id="previewList"><div class="card empty">目前沒有排程預覽</div></div>
</section>
</main>

<script>
const SHEET_ID="1bcZ1ZzsKq7Ji_QYu9ahb_TMcZLcxowX8DWpio7ehOsI";
const API="https://script.google.com/macros/s/AKfycbzUSzoGVLRCaqBjE4B8Hbmy-viUuYW7pQSB5mlRaxj-pkE96y8W6K3uls2djftrCKrSBg/exec";
let attendance=[],preview=[];

function clean(v){return String(v==null?"":v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function parseCsv(text){
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];
    if(ch==='"'){if(q&&next==='"'){cell+='"';i++}else q=!q}
    else if(ch===","&&!q){row.push(cell);cell=""}
    else if((ch==="\n"||ch==="\r")&&!q){if(ch==="\r"&&next==="\n")i++;row.push(cell);out.push(row);row=[];cell=""}
    else cell+=ch;
  }
  if(cell.length||row.length){row.push(cell);out.push(row)}return out;
}
async function csvSheet(name){
  const u="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(name)+"&_="+Date.now();
  const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("讀取失敗");return parseCsv(await r.text());
}
function objects(rows){const h=(rows[0]||[]).map(clean);return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=clean(r[i]));return o})}

async function requestPreviewRefresh(){
  try{
    await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"refreshPreview"})});
    await new Promise(r=>setTimeout(r,700));
  }catch(e){}
}

async function loadAll(){
  document.getElementById("summary").textContent="同步中…";
  document.getElementById("previewSummary").textContent="同步中…";
  try{
    await requestPreviewRefresh();
    const rs=await Promise.all([csvSheet("報名紀錄"),csvSheet("排程預覽")]);
    attendance=objects(rs[0]).filter(r=>clean(r["姓名"]));
    preview=objects(rs[1]).filter(r=>clean(r["姓名"]));
    renderAttendance();renderPreview();
  }catch(e){
    document.getElementById("summary").textContent="同步失敗";
    document.getElementById("previewSummary").textContent="同步失敗";
  }
}

function activeRecord(r){const s=clean(r["狀態"]);return !s||s==="已報名"}
function displaySchool(r){return clean(r["指派學校"])||clean(r["地點"])||"待分派"}

function renderAttendance(){
  const df=clean(document.getElementById("dateFilter").value).toLowerCase();
  const pf=clean(document.getElementById("placeFilter").value).toLowerCase();
  const sf=document.getElementById("statusFilter").value;

  const rows=attendance.filter(r=>{
    const active=activeRecord(r);
    const sm=sf==="all"||(sf==="active"&&active)||(sf==="cancelled"&&!active);
    return sm&&(!df||clean(r["日期"]).toLowerCase().includes(df))&&(!pf||displaySchool(r).toLowerCase().includes(pf));
  });

  document.getElementById("summary").textContent="共 "+rows.length+" 筆";
  const groups={};
  rows.forEach(r=>{
    const school=displaySchool(r),k=clean(r["日期"])+"||"+clean(r["班次時間"])+"||"+school;
    (groups[k]||(groups[k]=[])).push(r);
  });

  const keys=Object.keys(groups);
  if(!keys.length){document.getElementById("attendanceList").innerHTML='<div class="card empty">沒有符合條件的資料</div>';return}

  document.getElementById("attendanceList").innerHTML=keys.map(k=>{
    const g=groups[k],f=g[0],school=displaySchool(f);
    return '<section class="card"><div class="head"><div><div class="place">'+esc(school)+'</div><div class="date">'+esc(f["日期"])+' '+esc(f["班次時間"])+'</div>'+
      (clean(f["排程類型"])?'<span class="badge">'+esc(f["排程類型"])+'</span>':'')+
      '</div><div class="count">'+g.length+' 人</div></div>'+
      '<table><thead><tr><th>姓名</th><th>可出勤到</th><th>排程狀態</th><th>填寫時間</th><th>取消時間</th></tr></thead><tbody>'+
      g.map(r=>'<tr><td>'+esc(r["姓名"])+'</td><td>'+esc(r["可出勤到幾點"])+'</td><td>'+esc(clean(r["排程狀態"])||(activeRecord(r)?"待分派":"已取消"))+'</td><td>'+esc(r["填寫時間"])+'</td><td>'+esc(r["取消時間"])+'</td></tr>').join("")+
      '</tbody></table></section>';
  }).join("");
}

function renderPreview(){
  if(!preview.length){
    document.getElementById("previewSummary").textContent="目前沒有排程預覽";
    document.getElementById("previewList").innerHTML='<div class="card empty">18:15 後若隔日有一般排程與報名資料，這裡會出現建議分配。</div>';
    return;
  }

  const latest=preview.map(r=>clean(r["產生時間"])).filter(Boolean).sort().pop()||"";
  document.getElementById("previewSummary").textContent="共 "+preview.length+" 人"+(latest?" · 產生時間 "+latest:"");

  const groups={};
  preview.forEach(r=>{
    const k=clean(r["日期"])+"||"+clean(r["班次時間"])+"||"+clean(r["建議學校"]);
    (groups[k]||(groups[k]=[])).push(r);
  });

  document.getElementById("previewList").innerHTML=Object.keys(groups).map(k=>{
    const g=groups[k],f=g[0];
    return '<section class="card"><div class="head"><div><div class="place">'+esc(f["建議學校"])+'</div><div class="date">'+esc(f["日期"])+' '+esc(f["班次時間"])+'</div></div><div class="count">'+g.length+' 人</div></div>'+
      '<table><thead><tr><th>姓名</th><th>建議指派</th></tr></thead><tbody>'+
      g.map(r=>'<tr><td>'+esc(r["姓名"])+'</td><td>'+esc(r["建議學校"])+'</td></tr>').join("")+
      '</tbody></table></section>';
  }).join("");
}

function switchTab(tab){
  const a=tab==="attendance";
  document.getElementById("attendancePanel").className=a?"":"hidden";
  document.getElementById("previewPanel").className=a?"hidden":"";
  document.getElementById("tabAttendance").className="tab"+(a?" active":"");
  document.getElementById("tabPreview").className="tab"+(!a?" active":"");
}

loadAll();
setInterval(loadAll,30000);
</script>
</body>
</html>
