<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工讀排班管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:1050px;margin:auto;padding:24px 16px 48px}
h1{margin:0;font-size:30px}.sub{margin-top:6px;color:#6b7280}
.tabs{display:flex;gap:8px;margin:20px 0 16px}.tab{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.tab.active{background:#111827;color:#fff;border-color:#111827}
.filters{display:grid;grid-template-columns:1fr 1fr 180px auto;gap:10px;align-items:end;margin-bottom:14px}
label{display:block;font-weight:700;margin:0 0 7px}
input,select{width:100%;height:46px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:15px;background:#fff}
button{height:46px;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer}
.summary{color:#6b7280;margin-bottom:12px;font-size:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 26px rgba(17,24,39,.05)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.place{font-size:21px;font-weight:800}.date{margin-top:4px;color:#6b7280}.count{font-weight:800}
.badge{display:inline-block;margin-top:8px;padding:6px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e5e7eb;font-size:14px}th{font-size:12px;color:#6b7280}
.empty{text-align:center;color:#6b7280;padding:24px}.preview-note{padding:12px 14px;border-radius:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:14px;font-weight:700}
.hidden{display:none}
.preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.preview-school{border:1px solid #e5e7eb;border-radius:16px;padding:14px;background:#fafafa}
.preview-school-title{display:flex;justify-content:space-between;gap:8px;font-size:18px;font-weight:900}
.preview-ratio{font-size:13px;color:#6b7280;font-weight:700;margin-top:5px}
.preview-person{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-top:8px}
.preview-person-main{display:grid;grid-template-columns:minmax(80px,1fr) 42px 70px 88px;gap:8px;align-items:center}
.preview-name{font-weight:900}.preview-until{color:#047857;font-weight:900;text-align:right}.preview-move{font-size:12px;font-weight:800;text-align:right;color:#6b7280}.preview-move.ok{color:#047857}.preview-move.warn{color:#b45309}
.manual-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed #d1d5db}
.manual-row span{font-size:12px;color:#6b7280;font-weight:800;align-self:center}
.movebtn{height:32px;padding:0 9px;border-radius:9px;font-size:12px;font-weight:800}
.movebtn.active{background:#111827;color:#fff;border-color:#111827}
.preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.standby{margin-top:16px;border-top:1px solid #e5e7eb;padding-top:14px}.standby h3{margin:0 0 8px;font-size:17px}
@media(max-width:700px){.preview-grid{grid-template-columns:1fr}.preview-person-main{grid-template-columns:1fr 38px 64px}.preview-move{grid-column:1/-1;text-align:left}}
@media(max-width:700px){.filters{grid-template-columns:1fr}.card{padding:14px}table{display:block;overflow-x:auto;white-space:nowrap}.tabs{overflow-x:auto}}
</style>
</head>
<body>
<main>
<h1>工讀排班管理</h1>
<div class="sub">正職人員／人資使用</div>

<div class="tabs">
  <button id="tabAttendance" class="tab active" onclick="switchTab('attendance')">出勤名單</button>
  <button id="tabPreview" class="tab" onclick="switchTab('preview')">排程預覽</button>
</div>

<section id="attendancePanel">
  <div class="filters">
    <div><label>日期</label><input id="dateFilter" placeholder="例如 10/5" oninput="renderAttendance()"></div>
    <div><label>學校</label><input id="placeFilter" placeholder="輸入學校名稱" oninput="renderAttendance()"></div>
    <div><label>狀態</label><select id="statusFilter" onchange="renderAttendance()"><option value="active">已報名／已公布</option><option value="cancelled">已取消</option><option value="all">全部</option></select></div>
    <button onclick="loadAll()">重新整理</button>
  </div>
  <div id="summary" class="summary">載入中…</div>
  <div id="attendanceList"><div class="card empty">載入資料中…</div></div>
</section>

<section id="previewPanel" class="hidden">
  <div class="preview-note">系統會依報名名單先做男女平均分配，並盡量平均分散可搬運人員；你可以再手動把任何人調到指定學校或候補。</div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
    <div id="previewSummary" class="summary" style="margin:0">載入中…</div>
    <button onclick="loadAll()">重新整理預覽</button>
  </div>
  <div id="previewList"><div class="card empty">目前沒有排程預覽</div></div>
</section>
</main>

<script>
const SHEET_ID="1bcZ1ZzsKq7Ji_QYu9ahb_TMcZLcxowX8DWpio7ehOsI";
const API="https://script.google.com/macros/s/AKfycbzUSzoGVLRCaqBjE4B8Hbmy-viUuYW7pQSB5mlRaxj-pkE96y8W6K3uls2djftrCKrSBg/exec";
let attendance=[],workers=[],tasks=[],rerollNonce={},manualOverrides={};

function clean(v){return String(v==null?"":v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function parseCsv(text){
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];
    if(ch==='"'){if(q&&next==='"'){cell+='"';i++}else q=!q}
    else if(ch===","&&!q){row.push(cell);cell=""}
    else if((ch==="\n"||ch==="\r")&&!q){if(ch==="\r"&&next==="\n")i++;row.push(cell);out.push(row);row=[];cell=""}
    else cell+=ch;
  }
  if(cell.length||row.length){row.push(cell);out.push(row)}return out;
}
async function csvSheet(name){
  const u="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(name)+"&_="+Date.now();
  const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("讀取失敗");return parseCsv(await r.text());
}
function objects(rows){const h=(rows[0]||[]).map(clean);return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=clean(r[i]));return o})}

async function requestPreviewRefresh(){
  try{
    await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"refreshPreview"})});
    await new Promise(r=>setTimeout(r,700));
  }catch(e){}
}

async function loadAll(){
  document.getElementById("summary").textContent="同步中…";
  document.getElementById("previewSummary").textContent="同步中…";
  try{
    const rs=await Promise.all([csvSheet("報名紀錄"),csvSheet("工讀生名單"),csvSheet("工作任務")]);
    attendance=objects(rs[0]).filter(r=>clean(r["姓名"]));
    workers=objects(rs[1]).filter(r=>clean(r["姓名"]));
    tasks=objects(rs[2]).filter(r=>clean(r["日期"])&&clean(r["時間"])&&clean(r["地點"]));
    renderAttendance();renderPreview();
  }catch(e){
    document.getElementById("summary").textContent="同步失敗";
    document.getElementById("previewSummary").textContent="同步失敗";
  }
}

function activeRecord(r){const s=clean(r["狀態"]);return !s||s==="已報名"}
function singleSchoolForRecord(r){
  const date=clean(r["日期"]);
  const shift=normalizeTimeText(r["班次時間"]);
  const matches=tasks.filter(t=>clean(t["日期"])===date && normalizeTimeText(t["時間"])===shift);
  const schools=[...new Set(matches.map(t=>clean(t["地點"])).filter(Boolean))];
  return schools.length===1 ? schools[0] : "";
}
function displaySchool(r){
  const assigned=clean(r["指派學校"]);
  if(assigned) return assigned;
  const place=clean(r["地點"]);
  if(place && place!=="待分派") return place;
  return singleSchoolForRecord(r)||"待分派";
}
function displayScheduleStatus(r){
  if(!activeRecord(r)) return "已取消";
  const status=clean(r["排程狀態"]);
  if(status && status!=="待分派") return status;
  return displaySchool(r)!=="待分派" ? "已分派" : "待分派";
}

function renderAttendance(){
  const df=clean(document.getElementById("dateFilter").value).toLowerCase();
  const pf=clean(document.getElementById("placeFilter").value).toLowerCase();
  const sf=document.getElementById("statusFilter").value;

  const rows=attendance.filter(r=>{
    const active=activeRecord(r);
    const sm=sf==="all"||(sf==="active"&&active)||(sf==="cancelled"&&!active);
    return sm&&(!df||clean(r["日期"]).toLowerCase().includes(df))&&(!pf||displaySchool(r).toLowerCase().includes(pf));
  });

  document.getElementById("summary").textContent="共 "+rows.length+" 筆";
  const groups={};
  rows.forEach(r=>{
    const school=displaySchool(r),k=clean(r["日期"])+"||"+clean(r["班次時間"])+"||"+school;
    (groups[k]||(groups[k]=[])).push(r);
  });

  const keys=Object.keys(groups);
  if(!keys.length){document.getElementById("attendanceList").innerHTML='<div class="card empty">沒有符合條件的資料</div>';return}

  document.getElementById("attendanceList").innerHTML=keys.map(k=>{
    const g=groups[k],f=g[0],school=displaySchool(f);
    return '<section class="card"><div class="head"><div><div class="place">'+esc(school)+'</div><div class="date">'+esc(f["日期"])+' '+esc(f["班次時間"])+'</div>'+
      (clean(f["排程類型"])?'<span class="badge">'+esc(f["排程類型"])+'</span>':'')+
      '</div><div class="count">'+g.length+' 人</div></div>'+
      '<table><thead><tr><th>姓名</th><th>可出勤到</th><th>排程狀態</th><th>填寫時間</th><th>取消時間</th></tr></thead><tbody>'+
      g.map(r=>'<tr><td>'+esc(r["姓名"])+'</td><td>'+esc(r["可出勤到幾點"])+'</td><td>'+esc(displayScheduleStatus(r))+'</td><td>'+esc(r["填寫時間"])+'</td><td>'+esc(r["取消時間"])+'</td></tr>').join("")+
      '</tbody></table></section>';
  }).join("");
}

function normalizeTimeText(v){const m=clean(v).match(/(\d{1,2})\s*:\s*(\d{2})/);return m?String(Number(m[1])).padStart(2,"0")+":"+m[2]:clean(v)}
function timeMinutes(v){const m=clean(v).match(/(\d{1,2})\s*:\s*(\d{2})/);return m?Number(m[1])*60+Number(m[2]):0}
function dateOrder(v){const m=clean(v).match(/^(\d{1,2})\/(\d{1,2})$/);return m?Number(m[1])*100+Number(m[2]):99999}

function buildTaskGroups(){
  const map=new Map();
  tasks.forEach(t=>{
    const date=clean(t["日期"]),time=normalizeTimeText(t["時間"]),key=date+"||"+time;
    if(!map.has(key))map.set(key,{key,date,time,schools:[]});
    map.get(key).schools.push({name:clean(t["地點"]),need:Number(clean(t["人數"]))||0});
  });
  return [...map.values()]
    .filter(g=>g.schools.some(s=>s.need>0))
    .sort((a,b)=>dateOrder(a.date)-dateOrder(b.date)||timeMinutes(a.time)-timeMinutes(b.time));
}
function workerMap(){const m=new Map();workers.forEach(w=>m.set(clean(w["姓名"]),w));return m}
function signupPeople(group){
  const wmap=workerMap(),latest=new Map(),schoolNames=new Set(group.schools.map(s=>s.name));
  attendance.forEach(s=>{
    if(!activeRecord(s)||clean(s["日期"])!==group.date)return;
    const shift=normalizeTimeText(s["班次時間"]);
    const legacy=schoolNames.has(clean(s["地點"]))&&!shift;
    if(!(shift===group.time||legacy))return;
    const name=clean(s["姓名"]);if(!name)return;
    latest.set(name,s);
  });
  return [...latest.values()].map(s=>{
    const w=wmap.get(clean(s["姓名"]))||{};
    return {name:clean(s["姓名"]),sex:clean(w["性別"])||"未填",move:clean(w["可搬運"])||"",until:clean(s["可出勤到幾點"])||""};
  });
}
function hashString(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seededRandom(seed){let x=seed>>>0;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffleStable(arr,seed){const a=arr.slice(),r=seededRandom(hashString(seed));for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function allocate(group,people){
  const totalNeed=group.schools.reduce((s,x)=>s+x.need,0);
  const nonce=rerollNonce[group.key]||0;
  const seed=group.key+"|"+nonce+"|"+people.map(p=>p.name+":"+p.until).sort().join("|");
  let men=shuffleStable(people.filter(p=>p.sex==="男"),seed+"m");
  let women=shuffleStable(people.filter(p=>p.sex==="女"),seed+"f");
  let other=shuffleStable(people.filter(p=>p.sex!=="男"&&p.sex!=="女"),seed+"o");
  const moverFirst=a=>a.slice().sort((x,y)=>(y.move==="可")-(x.move==="可"));
  men=moverFirst(men);women=moverFirst(women);other=moverFirst(other);

  const assigned=group.schools.map(s=>({school:s.name,need:s.need,people:[]}));
  for(const box of assigned){
    while(box.people.length<box.need){
      const mc=box.people.filter(p=>p.sex==="男").length,fc=box.people.filter(p=>p.sex==="女").length;
      let p=null;
      if(mc<fc&&men.length)p=men.shift();
      else if(fc<mc&&women.length)p=women.shift();
      else if(men.length&&women.length)p=(men.length>=women.length?men:women).shift();
      else if(men.length)p=men.shift();
      else if(women.length)p=women.shift();
      else if(other.length)p=other.shift();
      if(!p)break;
      box.people.push(p);
    }
  }
  const moverCount=b=>b.people.filter(p=>p.move==="可").length;
  for(const target of assigned){
    if(moverCount(target)>0)continue;
    const donor=assigned.find(b=>moverCount(b)>1);
    if(!donor)continue;
    for(let i=0;i<target.people.length;i++){
      const t=target.people[i],j=donor.people.findIndex(p=>p.move==="可"&&p.sex===t.sex);
      if(j>=0){const d=donor.people[j];donor.people[j]=t;target.people[i]=d;break}
    }
  }
  return {assigned,standby:[...men,...women,...other],totalNeed};
}
function applyOverrides(group,result){
  const all=[];result.assigned.forEach(b=>b.people.forEach(p=>all.push({p,place:b.school})));result.standby.forEach(p=>all.push({p,place:"候補"}));
  const ov=manualOverrides[group.key]||{};
  all.forEach(x=>{if(ov[x.p.name])x.place=ov[x.p.name]});
  const assigned=group.schools.map(s=>({school:s.name,need:s.need,people:[]})),standby=[];
  all.forEach(x=>{if(x.place==="候補")standby.push(x.p);else{const b=assigned.find(v=>v.school===x.place);b?b.people.push(x.p):standby.push(x.p)}});
  return {assigned,standby,totalNeed:result.totalNeed};
}
function setManual(groupKey,name,place){if(!manualOverrides[groupKey])manualOverrides[groupKey]={};manualOverrides[groupKey][name]=place;renderPreview()}
function reroll(groupKey){rerollNonce[groupKey]=(rerollNonce[groupKey]||0)+1;manualOverrides[groupKey]={};renderPreview()}
function resetManual(groupKey){manualOverrides[groupKey]={};renderPreview()}
function personPreviewHtml(group,p,current){
  const places=[...group.schools.map(s=>s.name),"候補"];
  const buttons=places.map(place=>'<button class="movebtn '+(place===current?'active':'')+'" onclick="setManual(\''+group.key.replace(/'/g,"\\'")+'\',\''+p.name.replace(/'/g,"\\'")+'\',\''+place.replace(/'/g,"\\'")+'\')">'+esc(place)+'</button>').join("");
  const mc=p.move==="可"?"ok":p.move==="注意"?"warn":"";
  return '<div class="preview-person"><div class="preview-person-main"><div class="preview-name">'+esc(p.name)+'</div><div>'+esc(p.sex)+'</div><div class="preview-until">'+esc(p.until||"-")+'</div><div class="preview-move '+mc+'">'+esc(p.move?("搬運："+p.move):"")+'</div></div><div class="manual-row"><span>手動調配：</span>'+buttons+'</div></div>';
}
function renderPreview(){
  const groups=buildTaskGroups();
  if(!groups.length){
    document.getElementById("previewSummary").textContent="目前沒有可分配班次";
    document.getElementById("previewList").innerHTML='<div class="card empty">工作任務需要填寫人數後，這裡才會產生分配預覽。</div>';
    return;
  }
  document.getElementById("previewSummary").textContent="共 "+groups.length+" 個班次";
  document.getElementById("previewList").innerHTML=groups.map(g=>{
    const people=signupPeople(g),result=applyOverrides(g,allocate(g,people));
    const totalM=people.filter(p=>p.sex==="男").length,totalF=people.filter(p=>p.sex==="女").length;
    const schools=result.assigned.map(b=>{
      const m=b.people.filter(p=>p.sex==="男").length,f=b.people.filter(p=>p.sex==="女").length,mv=b.people.filter(p=>p.move==="可").length;
      return '<div class="preview-school"><div class="preview-school-title"><span>'+esc(b.school)+'</span><span>'+b.people.length+'/'+b.need+'</span></div><div class="preview-ratio">男 '+m+'｜女 '+f+'｜可搬運 '+mv+'</div>'+b.people.map(p=>personPreviewHtml(g,p,b.school)).join("")+'</div>';
    }).join("");
    const standby=result.standby.length?'<div class="standby"><h3>候補 '+result.standby.length+' 人</h3>'+result.standby.map(p=>personPreviewHtml(g,p,"候補")).join("")+'</div>':'';
    return '<section class="card"><div class="head"><div><div class="place">'+esc(g.date+' '+g.time)+'｜分配預覽</div><div class="date">報名 '+people.length+' 人｜需求 '+result.totalNeed+' 人｜男 '+totalM+' / 女 '+totalF+'</div></div><div class="count">'+(people.length>=result.totalNeed?'可排滿':'缺 '+(result.totalNeed-people.length)+' 人')+'</div></div><div class="preview-grid">'+schools+'</div>'+standby+'<div class="preview-actions"><button onclick="reroll(\''+g.key.replace(/'/g,"\\'")+'\')">重新隨機</button><button onclick="resetManual(\''+g.key.replace(/'/g,"\\'")+'\')">清除手動調配</button></div></section>';
  }).join("");
}

function switchTab(tab){
  const a=tab==="attendance";
  document.getElementById("attendancePanel").className=a?"":"hidden";
  document.getElementById("previewPanel").className=a?"hidden":"";
  document.getElementById("tabAttendance").className="tab"+(a?" active":"");
  document.getElementById("tabPreview").className="tab"+(!a?" active":"");
}

loadAll();
setInterval(loadAll,30000);
</script>
</body>
</html>
