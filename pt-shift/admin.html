<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工讀排班｜管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:980px;margin:auto;padding:22px 14px 44px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:30px}.sub{margin-top:6px;color:#6b7280}.back{color:#111827;text-decoration:none;border:1px solid #d1d5db;background:#fff;padding:9px 12px;border-radius:10px;font-weight:700}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(17,24,39,.06)}
.login{max-width:460px;margin:70px auto 0}
label{display:block;font-weight:700;margin:12px 0 7px}
input,select{width:100%;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 14px;font-size:16px;background:#fff}
.btn{width:100%;margin-top:14px;border:0;border-radius:14px;background:#111827;color:#fff;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer}
.btn.secondary{width:auto;margin:0;background:#fff;color:#111827;border:1px solid #d1d5db;padding:9px 12px;font-size:14px}
.notice{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px}.notice.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.notice.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:14px}
.task-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.place{font-size:20px;font-weight:800}.meta{color:#6b7280;margin-top:5px;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e5e7eb;font-size:14px}th{color:#6b7280;font-size:12px}
.empty{text-align:center;color:#6b7280;padding:20px}
#adminPanel{display:none}
@media(max-width:700px){.filters{grid-template-columns:1fr}.top{align-items:center}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>出勤名單</h1><div class="sub">正職人員／人資管理分頁</div></div><a class="back" href="index.html">回排班頁</a></div>
<div id="notice" class="notice"></div>

<section id="loginCard" class="card login">
  <h2 style="margin-top:0">管理者登入</h2>
  <div class="sub">請輸入管理密碼</div>
  <label>密碼</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="管理密碼">
  <button class="btn" onclick="login()">登入</button>
</section>

<section id="adminPanel">
  <div class="card">
    <div class="filters">
      <div><label>日期篩選</label><input id="dateFilter" placeholder="例如 10/4"></div>
      <div><label>學校篩選</label><input id="placeFilter" placeholder="輸入學校名稱"></div>
      <button class="btn secondary" onclick="render()">套用篩選</button>
    </div>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <div id="summary" class="sub"></div>
      <button class="btn secondary" onclick="logout()">登出</button>
    </div>
  </div>
  <div id="list"></div>
</section>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbzUSzoGVLRCaqBjE4B8Hbmy-viUuYW7pQSB5mlRaxj-pkE96y8W6K3uls2djftrCKrSBg/exec";
let token=sessionStorage.getItem("ptShiftAdminToken")||"";
let rows=[];
function clean(v){return String(v==null?"":v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function msg(t,type){const n=document.getElementById("notice");n.textContent=t;n.className="notice "+(type==="err"?"err":"ok")}
async function login(){
  const password=clean(document.getElementById("password").value);
  if(!password)return msg("請輸入密碼","err");
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"adminLogin",password})});
    const d=await r.json();
    if(!d.success)throw new Error(d.error||"登入失敗");
    token=d.token;
    sessionStorage.setItem("ptShiftAdminToken",token);
    document.getElementById("password").value="";
    await loadAdmin();
  }catch(e){msg(e.message||"登入失敗","err")}
}
async function loadAdmin(){
  if(!token)return;
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"adminData",token})});
    const d=await r.json();
    if(!d.success)throw new Error(d.error||"驗證失敗");
    rows=Array.isArray(d.rows)?d.rows:[];
    document.getElementById("loginCard").style.display="none";
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("notice").className="notice";
    render();
  }catch(e){
    sessionStorage.removeItem("ptShiftAdminToken");token="";
    document.getElementById("loginCard").style.display="block";
    document.getElementById("adminPanel").style.display="none";
    msg(e.message||"請重新登入","err");
  }
}
function render(){
  const df=clean(document.getElementById("dateFilter").value).toLowerCase();
  const pf=clean(document.getElementById("placeFilter").value).toLowerCase();
  const filtered=rows.filter(r=>(!df||clean(r["日期"]).toLowerCase().includes(df))&&(!pf||clean(r["地點"]).toLowerCase().includes(pf)));
  const groups={};
  filtered.forEach(r=>{const k=clean(r["日期"])+"||"+clean(r["地點"]);(groups[k]||(groups[k]=[])).push(r)});
  const list=document.getElementById("list");
  document.getElementById("summary").textContent="共 "+filtered.length+" 筆出勤登記";
  const keys=Object.keys(groups);
  if(!keys.length){list.innerHTML='<div class="card empty">沒有符合條件的資料</div>';return}
  list.innerHTML=keys.map(k=>{
    const g=groups[k],first=g[0];
    return '<div class="card"><div class="task-title"><div><div class="place">'+esc(first["地點"])+'</div><div class="meta">'+esc(first["日期"])+'</div></div><strong>'+g.length+' 人</strong></div>'+
    '<table><thead><tr><th>姓名</th><th>可出勤到</th><th>填寫時間</th></tr></thead><tbody>'+
    g.map(r=>'<tr><td>'+esc(r["姓名"])+'</td><td>'+esc(r["可出勤到幾點"])+'</td><td>'+esc(r["填寫時間"])+'</td></tr>').join("")+
    '</tbody></table></div>';
  }).join("");
}
function logout(){sessionStorage.removeItem("ptShiftAdminToken");token="";rows=[];document.getElementById("adminPanel").style.display="none";document.getElementById("loginCard").style.display="block";msg("已登出","ok")}
if(token)loadAdmin();
</script>
</body>
</html>
