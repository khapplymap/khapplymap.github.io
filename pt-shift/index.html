<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工讀排班</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:760px;margin:auto;padding:22px 14px 44px}
h1{font-size:30px;margin:4px 0 2px}.sub{color:#6b7280;margin-bottom:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;color:#6b7280;font-size:14px}
.refresh{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.05)}
.head{display:flex;justify-content:space-between;gap:12px}.place{font-size:22px;font-weight:800}.school-block{margin-top:14px}.school-label{font-size:18px;font-weight:900;color:#dc2626;margin-bottom:8px}.school-item{font-size:18px;font-weight:800;color:#dc2626;line-height:1.65}.school-list{display:flex;flex-direction:column;gap:3px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.pill{background:#f3f4f6;padding:7px 10px;border-radius:999px;font-size:13px}
.count{font-size:14px;color:#6b7280;white-space:nowrap}
label{display:block;font-weight:700;margin:13px 0 7px}
select,input{width:100%;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:#111827}.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.time-sep{font-size:22px;font-weight:800;color:#6b7280;text-align:center}
select{appearance:auto;-webkit-appearance:menulist}
.btn{width:100%;margin-top:14px;height:50px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.person{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #eceff3;border-radius:12px;background:#fafafa;margin-top:7px}
.time{font-weight:800;color:#0f766e}.empty{color:#6b7280;text-align:center;padding:12px}
.notice{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px;border:1px solid #d1d5db;background:#fff}
.notice.error{display:block;border-color:#fecaca;background:#fef2f2;color:#991b1b}
.notice.ok{display:block;border-color:#a7f3d0;background:#ecfdf5;color:#065f46}
hr{border:0;border-top:1px solid #e5e7eb;margin:16px 0}
.section-title{font-size:20px;font-weight:900;margin:22px 2px 12px}
.section-title:first-child{margin-top:4px}
.history-wrap{margin-top:26px;padding-top:4px;border-top:2px solid #e5e7eb}
.history-card{opacity:.92}
@media(max-width:560px){main{padding:14px 12px 36px}h1{font-size:27px}.card{border-radius:18px;padding:16px}.place{font-size:20px}}
</style>
</head>
<body>
<main>
  <h1>工讀排班</h1>
  <div class="sub">選擇工作任務，登記你可以出勤到幾點</div>
  <div id="notice" class="notice"></div>
  <div class="toolbar">
    <span id="status">同步中…</span>
    <button class="refresh" onclick="loadAll()">重新整理</button>
  </div>
  <div id="content"><div class="card empty">同步資料中…</div></div>
<div style="text-align:center;color:#9ca3af;font-size:11px;margin-top:14px">版本 2350</div></main>
<script>
const BUILD_VERSION="20261002-2350";
const API="https://script.google.com/macros/s/AKfycbzUSzoGVLRCaqBjE4B8Hbmy-viUuYW7pQSB5mlRaxj-pkE96y8W6K3uls2djftrCKrSBg/exec";
const SHEET_ID="1bcZ1ZzsKq7Ji_QYu9ahb_TMcZLcxowX8DWpio7ehOsI";
let workers=[],tasks=[],signups=[];
const clean=v=>String(v??"").trim();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function maskName(name){
  const s=clean(name);
  if(!s) return "";
  if(s.length===1) return s;
  if(s.length===2) return s[0]+"○";
  return s[0]+"○".repeat(s.length-2)+s[s.length-1];
}

async function ensureLatestVersion(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs) await reg.unregister();
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }

    const r=await fetch("./version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const info=await r.json();
    const latest=clean(info.version);
    if(latest && latest!==BUILD_VERSION){
      const u=new URL(location.href);
      u.searchParams.set("v",latest);
      location.replace(u.toString());
    }
  }catch(e){}
}

function show(msg,type="ok"){
  const n=document.getElementById("notice");
  n.textContent=msg;
  n.className="notice "+type;
  clearTimeout(window.__noticeTimer);
  window.__noticeTimer=setTimeout(()=>{n.className="notice";n.style.display="none"},2600);
}

function activeSignup(s){
  const status=clean(s["狀態"]);
  return !status || status==="已報名";
}

function periodKey(timeText){
  const m=clean(timeText).match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(!m) return "all";
  const h=Number(m[1]);
  if(h<12) return "am";
  if(h<18) return "pm";
  return "eve";
}

function normalizeTimeText(v){
  const m=clean(v).match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(!m) return clean(v);
  return String(Number(m[1])).padStart(2,"0")+":"+m[2];
}

function timeMinutes(timeText){
  const m=clean(timeText).match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(!m) return null;
  return Number(m[1])*60+Number(m[2]);
}

function timeMinutes(timeText){
  const m=clean(timeText).match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(!m) return null;
  return Number(m[1])*60+Number(m[2]);
}

function groupTasks(rows){
  const map=new Map();
  rows.forEach(t=>{
    const date=clean(t["日期"]);
    const rawTime=clean(t["時間"]);
    const displayTime=normalizeTimeText(rawTime);
    const mins=timeMinutes(rawTime);
    const isAfternoon=mins!==null && mins>=12*60;
    const k=date+"||"+rawTime;

    if(!map.has(k)){
      map.set(k,{
        date,
        rawTime,
        displayTime,
        isAfternoon,
        schools:[],
        headcount:""
      });
    }

    const g=map.get(k);
    const school=clean(t["地點"]);
    const n=Number(clean(t["人數"]));
    if(school) g.schools.push({school,time:displayTime,headcount:n||0});

    if(n) g.headcount=String((Number(g.headcount)||0)+n);
  });
  function dateOrderValue(dateText){
    const m=clean(dateText).match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m) return Number.MAX_SAFE_INTEGER;
    return Number(m[1])*100+Number(m[2]);
  }

  return Array.from(map.values()).sort((a,b)=>{
    const da=dateOrderValue(a.date);
    const db=dateOrderValue(b.date);
    if(da!==db) return da-db;
    return (timeMinutes(a.rawTime)||0)-(timeMinutes(b.rawTime)||0);
  });
}

function groupPeople(group){
  const schoolNames=new Set(group.schools.map(x=>x.school));
  const byName=new Map();
  signups.forEach(s=>{
    if(!activeSignup(s)) return;
    if(clean(s["日期"])!==group.date) return;

    const signupShift=clean(s["班次時間"]);
    const sameShift=signupShift
      ? normalizeTimeText(signupShift)===group.displayTime
      : false;
    const place=clean(s["地點"]);
    const legacyMatch=schoolNames.has(place);
    const pendingMatch=place==="待分派" && sameShift;

    if(!(sameShift || legacyMatch || pendingMatch)) return;

    const name=clean(s["姓名"]);
    if(!name) return;
    byName.set(name,s);
  });
  return Array.from(byName.values());
}

function scheduleTitle(dateText){
  const d=clean(dateText);
  return d ? d+" 排班" : "排班";
}

function taipeiNowParts(){
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Taipei",
    year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hourCycle:"h23",
    weekday:"short"
  }).formatToParts(new Date());
  const o={};
  parts.forEach(p=>o[p.type]=p.value);
  return o;
}

function taskIsoDate(dateText){
  const m=clean(dateText).match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!m) return "";
  const now=taipeiNowParts();
  return now.year+"-"+String(Number(m[1])).padStart(2,"0")+"-"+String(Number(m[2])).padStart(2,"0");
}

function signupState(group){
  const iso=taskIsoDate(group.date);
  const now=taipeiNowParts();
  const today=now.year+"-"+now.month+"-"+now.day;
  const mins=Number(now.hour)*60+Number(now.minute);

  if(group.isAfternoon){
    if(iso!==today) return {open:false,reason:"當天 11:30 開放登記"};
    if(mins<11*60+30) return {open:false,reason:"當天 11:30 開放登記"};
    return {open:true,reason:""};
  }

  if(iso===today && mins>=10*60){
    return {open:false,reason:"上午班已截止登記"};
  }

  return {open:true,reason:""};
}

function parseCsv(text){
  const rows=[];
  let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'){
      if(quoted&&next==='"'){cell+='"';i++;}
      else quoted=!quoted;
    }else if(ch===","&&!quoted){
      row.push(cell);cell="";
    }else if((ch==="\n"||ch==="\r")&&!quoted){
      if(ch==="\r"&&next==="\n")i++;
      row.push(cell);rows.push(row);row=[];cell="";
    }else{
      cell+=ch;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  return rows;
}

async function readSheet(sheetName){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
    "/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(sheetName)+"&_="+Date.now();
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const r=await fetch(url,{cache:"no-store",signal:controller.signal});
    if(!r.ok) throw new Error(sheetName+" 讀取失敗");
    const rows=parseCsv(await r.text());
    const headers=(rows[0]||[]).map(clean);
    return rows.slice(1).map(row=>{
      const o={};
      headers.forEach((h,i)=>o[h]=clean(row[i]));
      return o;
    });
  }finally{
    clearTimeout(timer);
  }
}

async function loadAll(){
  document.getElementById("status").textContent="同步中…";
  try{
    const [workerRows,taskRows,signupRows]=await Promise.all([
      readSheet("工讀生名單"),
      readSheet("工作任務"),
      readSheet("報名紀錄")
    ]);

    workers=workerRows.map(r=>clean(r["姓名"])).filter(Boolean);
    tasks=taskRows.filter(r=>clean(r["日期"])&&clean(r["地點"]));
    signups=signupRows.filter(r=>clean(r["姓名"]));

    render();

    document.getElementById("status").textContent=
      "已同步 · "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    document.getElementById("status").textContent="同步失敗";
    document.getElementById("content").innerHTML=
      '<div class="card empty">目前無法讀取排班資料，請按「重新整理」再試一次。</div>';
    show((e&&e.name==="AbortError")?"同步逾時，請重新整理":(e.message||"讀取失敗"),"error");
  }
}

function timeOptions(startTime){
  const m=clean(startTime).match(/(\d{1,2})\s*:\s*(\d{2})/);
  let startMinutes=9*60;
  if(m){
    startMinutes=Number(m[1])*60+Number(m[2]);
    startMinutes=Math.ceil(startMinutes/30)*30;
  }
  const endMinutes=18*60;
  let html='<option value="">請選擇時間</option>';
  for(let mins=startMinutes; mins<=endMinutes; mins+=30){
    const h=String(Math.floor(mins/60)).padStart(2,"0");
    const mm=String(mins%60).padStart(2,"0");
    const v=h+":"+mm;
    html+='<option value="'+v+'">'+v+'</option>';
  }
  return html;
}

function hashString(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}

function seededRandom(seed){
  let x=seed>>>0;
  return function(){
    x+=0x6D2B79F5;
    let t=x;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

function shuffledStable(items,seedText){
  const out=items.slice();
  const rand=seededRandom(hashString(seedText));
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(rand()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

function buildAssignment(group,people){
  const schools=group.schools.filter(s=>Number(s.headcount)>0);
  if(schools.length<2) return null;

  const uniquePeople=[];
  const seen=new Set();
  people.forEach(p=>{
    const n=clean(p["姓名"]);
    if(n && !seen.has(n)){
      seen.add(n);
      uniquePeople.push(p);
    }
  });

  const seed=group.date+"|"+group.rawTime+"|"+
    schools.map(s=>s.school+":"+s.headcount).join("|")+"|"+
    uniquePeople.map(p=>clean(p["姓名"])+":"+clean(p["可出勤到幾點"])).sort().join("|");

  const pool=shuffledStable(uniquePeople,seed);
  let idx=0;
  const assigned=schools.map(s=>{
    const arr=[];
    const need=Number(s.headcount)||0;
    for(let k=0;k<need && idx<pool.length;k++,idx++) arr.push(pool[idx]);
    return {school:s.school,need,people:arr};
  });
  const standby=pool.slice(idx);
  return {assigned,standby};
}

function assignmentHtml(group,people){
  const result=buildAssignment(group,people);
  if(!result) return "";

  const blocks=result.assigned.map(a=>{
    const list=a.people.length
      ? a.people.map(p=>
          '<div class="person"><strong>'+esc(maskName(p["姓名"]))+'</strong><span class="time">'+esc(p["可出勤到幾點"])+'</span></div>'
        ).join("")
      : '<div class="empty">尚無人員</div>';
    return '<div style="margin-top:14px">'+
      '<div style="font-weight:900;font-size:17px;margin-bottom:6px">'+esc(a.school)+'｜'+a.people.length+'/'+a.need+' 人</div>'+
      list+
      '</div>';
  }).join("");

  const standby=result.standby.length
    ? '<div style="margin-top:16px"><div style="font-weight:900;font-size:17px;margin-bottom:6px">候補</div>'+
      result.standby.map(p=>
        '<div class="person"><strong>'+esc(maskName(p["姓名"]))+'</strong><span class="time">'+esc(p["可出勤到幾點"])+'</span></div>'
      ).join("")+
      '</div>'
    : "";

  return '<hr><div style="font-weight:900;font-size:19px;margin-bottom:4px">隨機指派結果</div>'+
    '<div style="color:#6b7280;font-size:13px;margin-bottom:6px">依目前報名名單自動產生</div>'+
    blocks+standby;
}

function isPastGroup(group){
  const iso=taskIsoDate(group.date);
  if(!iso) return false;
  const now=taipeiNowParts();
  const today=now.year+"-"+now.month+"-"+now.day;
  return iso<today;
}

function renderGroupCard(g,i,isHistory){
  const people=groupPeople(g);

  const opts='<option value="">請選擇姓名</option>'+
    workers.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");

  const peopleHtml=people.length
    ?people.map(p=>
      '<div class="person"><strong>'+esc(maskName(p["姓名"]))+'</strong><span class="time">'+esc(p["可出勤到幾點"])+'</span></div>'
    ).join("")
    :'<div class="empty">目前尚無人登記</div>';

  const schoolsHtml=g.schools.map(x=>
    '<div class="school-item">• '+esc(x.school)+(x.time?'｜'+esc(x.time):'')+'</div>'
  ).join("");

  let actionHtml="";
  if(isHistory){
    actionHtml='<hr>'+
      '<div style="font-weight:800;margin-bottom:6px">當日出勤人員</div>'+
      '<div class="people">'+peopleHtml+'</div>';
  }else{
    const state=signupState(g);
    if(state.open){
      actionHtml='<hr>'+
        '<label>姓名</label>'+
        '<select id="name_'+i+'">'+opts+'</select>'+
        '<label>可出勤到幾點</label>'+
        '<select id="until_'+i+'">'+timeOptions(g.displayTime)+'</select>'+
        '<button id="btn_'+i+'" class="btn" onclick="submitSignup('+i+')">確認可以上班</button>'+
        '<hr>'+
        '<div style="font-weight:800;margin-bottom:6px">目前可出勤人員</div>'+
        '<div class="people">'+peopleHtml+'</div>';
    }else{
      actionHtml='<hr>'+
        '<div class="notice" style="display:block;background:#f9fafb;color:#6b7280">'+esc(state.reason)+'</div>'+
        '<div style="font-weight:800;margin:14px 0 6px">目前可出勤人員</div>'+
        '<div class="people">'+peopleHtml+'</div>';
    }
  }

  return '<section class="card'+(isHistory?' history-card':'')+'">'+
    '<div class="head"><div><div class="place">'+esc(scheduleTitle(g.date))+'</div>'+
    '<div class="meta">'+
    (g.headcount?'<span class="pill">需求 '+esc(g.headcount)+' 人</span>':'')+
    (isHistory?'<span class="pill">已結束</span>':'')+
    '</div>'+
    '<div class="school-block"><div class="school-label">可能分派學校</div>'+
    '<div class="school-list">'+schoolsHtml+'</div></div>'+
    '</div><div class="count">已登記 '+people.length+
    (g.headcount?'/'+esc(g.headcount):'')+
    '</div></div>'+
    actionHtml+
    '</section>';
}

function render(){
  const root=document.getElementById("content");
  const groups=groupTasks(tasks);

  if(!groups.length){
    root.innerHTML='<div class="card empty">目前沒有工作任務</div>';
    return;
  }

  const current=[];
  const history=[];
  groups.forEach((g,i)=>{
    (isPastGroup(g)?history:current).push({g,i});
  });

  let html="";
  if(current.length){
    html+='<div class="section-title">目前／未來排班</div>'+
      current.map(x=>renderGroupCard(x.g,x.i,false)).join("");
  }else{
    html+='<div class="section-title">目前／未來排班</div><div class="card empty">目前沒有未來排班</div>';
  }

  if(history.length){
    html+='<div class="history-wrap"><div class="section-title">已結束排班</div>'+
      history.slice().reverse().map(x=>renderGroupCard(x.g,x.i,true)).join("")+
      '</div>';
  }

  root.innerHTML=html;
}

async function submitSignup(i){
  const groups=groupTasks(tasks);
  const group=groups[i];
  const name=clean(document.getElementById("name_"+i).value);
  const until=clean(document.getElementById("until_"+i).value);

  if(!name){
    show("請先選擇姓名","error");
    return;
  }

  if(!until){
    show("請填寫可出勤到幾點","error");
    return;
  }

  const btn=document.getElementById("btn_"+i);
  btn.disabled=true;
  btn.textContent="送出中…";

  try{
    await fetch(API,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"signup",
        date:group.date,
        place:group.schools.length===1 ? group.schools[0].school : "待分派",
        location:group.schools.length===1 ? group.schools[0].school : "待分派",
        shiftTime:group.rawTime,
        time:group.rawTime,
        mode:group.mode || "一般",
        name:name,
        until:until
      })
    });

    show("已送出登記","ok");
    await new Promise(r=>setTimeout(r,900));
    await loadAll();
  }catch(e){
    show(e.message||"送出失敗","error");
  }finally{
    btn.disabled=false;
    btn.textContent="確認可以上班";
  }
}

ensureLatestVersion().finally(()=>loadAll());
setInterval(loadAll,30000);
</script>
