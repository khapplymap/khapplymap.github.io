<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工讀排班</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:760px;margin:0 auto;padding:20px 14px 40px}
h1{margin:0;font-size:30px;font-weight:800}.sub{margin-top:6px;color:#6b7280}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;color:#6b7280;font-size:14px}
button.refresh{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(17,24,39,.06)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.place{font-size:22px;font-weight:800}.count{font-size:14px;color:#6b7280;white-space:nowrap}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{background:#f3f4f6;border-radius:999px;padding:7px 10px;font-size:13px}
hr{border:0;border-top:1px solid #e5e7eb;margin:16px 0}
label{display:block;font-weight:700;margin:12px 0 7px}
select{width:100%;height:50px;border:1px solid #d1d5db;border-radius:14px;background:#fff;color:#111827;padding:0 14px;font-size:16px}

.btn{width:100%;margin-top:14px;border:0;border-radius:14px;background:#111827;color:white;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.cancel-btn{display:none;width:100%;margin-top:9px;border:1px solid #fecaca;border-radius:14px;background:#fff;color:#b91c1c;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer}
.person{display:flex;justify-content:space-between;align-items:center;background:#fafafa;border:1px solid #eceff3;border-radius:12px;padding:10px 12px;margin-top:7px}.ptime{font-weight:800;color:#0f766e}
.notice{display:none;margin:0 0 14px;padding:12px 14px;border-radius:14px}.notice.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}.notice.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.empty{text-align:center;color:#6b7280;padding:12px}.locked{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-weight:700;font-size:14px}.disabled-field{opacity:.55;pointer-events:none}.hint{font-size:13px;color:#6b7280;margin-top:7px}.hint.active{color:#0f766e;font-weight:700}
@media(max-width:560px){main{padding:14px 12px 34px}.card{padding:16px;border-radius:18px}.place{font-size:20px}}
</style>
</head>
<body>
<main>
<h1>工讀排班</h1>
<div class="sub">選擇工作任務，登記你可以出勤到幾點</div>
<div id="notice" class="notice"></div>
<div class="toolbar">
  <span id="status">同步中…</span>
  <button class="refresh" onclick="loadAll()">重新整理</button>
</div>
<div id="content"><div class="card empty">載入資料中…</div></div>
</main>
<script>
const SHEET_ID="1bcZ1ZzsKq7Ji_QYu9ahb_TMcZLcxowX8DWpio7ehOsI";
const API="https://script.google.com/macros/s/AKfycbzUSzoGVLRCaqBjE4B8Hbmy-viUuYW7pQSB5mlRaxj-pkE96y8W6K3uls2djftrCKrSBg/exec";
let workers=[],tasks=[],signups=[];

function clean(v){return String(v==null?"":v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function taipeiToday(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const y=Number(parts.find(p=>p.type==="year").value);
  const m=Number(parts.find(p=>p.type==="month").value);
  const d=Number(parts.find(p=>p.type==="day").value);
  return new Date(y,m-1,d);
}
function taskDate(raw){
  const s=clean(raw);
  if(!s)return null;
  let m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if(m){
    const today=taipeiToday();
    return new Date(today.getFullYear(),Number(m[1])-1,Number(m[2]));
  }
  return null;
}
function parseClock(raw){
  const s=clean(raw);
  if(!s)return null;
  const m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return null;
  return {h:Number(m[1]),m:Number(m[2])};
}
function taipeiNowParts(){
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Taipei",
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hourCycle:"h23"
  }).formatToParts(new Date());
  const get=t=>Number(parts.find(p=>p.type===t).value);
  return {y:get("year"),m:get("month"),d:get("day"),h:get("hour"),min:get("minute")};
}
function isCurrentOrFutureTask(row){
  const d=taskDate(row["日期"]);
  if(!d)return true;
  return d>=taipeiToday();
}
function isTaskOpen(row){
  const openRaw=clean(row["開放時間"]);
  if(!openRaw)return true;

  const d=taskDate(row["日期"]);
  const clock=parseClock(openRaw);
  if(!d||!clock)return true;

  const now=taipeiNowParts();
  const taskY=d.getFullYear();
  const taskM=d.getMonth()+1;
  const taskD=d.getDate();

  if(now.y<taskY)return false;
  if(now.y>taskY)return true;
  if(now.m<taskM)return false;
  if(now.m>taskM)return true;
  if(now.d<taskD)return false;
  if(now.d>taskD)return true;

  const nowMinutes=now.h*60+now.min;
  const openMinutes=clock.h*60+clock.m;
  return nowMinutes>=openMinutes;
}
function show(msg,type){
  const n=document.getElementById("notice");
  n.textContent=msg;
  n.className="notice "+(type==="err"?"err":"ok");
  clearTimeout(window.__n);
  window.__n=setTimeout(function(){n.className="notice";n.style.display="none"},3000);
}
function parseCsv(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'){
      if(q&&next==='"'){cell+='"';i++}
      else q=!q;
    }else if(ch===","&&!q){row.push(cell);cell=""}
    else if((ch==="\n"||ch==="\r")&&!q){
      if(ch==="\r"&&next==="\n")i++;
      row.push(cell); rows.push(row); row=[]; cell="";
    }else cell+=ch;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows;
}
async function csvSheet(name){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(name)+"&_="+Date.now();
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("無法讀取 "+name);
  return parseCsv(await r.text());
}
async function loadAll(){
  document.getElementById("status").textContent="同步中…";
  try{
    const rs=await Promise.all([
      csvSheet("工讀生名單"),
      csvSheet("工作任務"),
      csvSheet("報名紀錄")
    ]);

    const wr=rs[0],tr=rs[1],sr=rs[2];

    workers=wr.slice(1).map(function(r){return clean(r[0])}).filter(Boolean);

    const th=(tr[0]||[]).map(clean);
    tasks=tr.slice(1).map(function(r){
      const o={}; th.forEach(function(h,i){o[h]=clean(r[i])}); return o;
    }).filter(function(o){return o["日期"]&&o["地點"]&&isCurrentOrFutureTask(o)});

    const sh=(sr[0]||[]).map(clean);
    signups=sr.slice(1).map(function(r){
      const o={}; sh.forEach(function(h,i){o[h]=clean(r[i])}); return o;
    }).filter(function(o){return o["姓名"]});

    render();
    document.getElementById("status").textContent="已同步 · "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  }catch(e){
    document.getElementById("status").textContent="同步失敗";
    document.getElementById("content").innerHTML='<div class="card empty">目前無法讀取排班資料</div>';
    show(e.message||"讀取失敗","err");
  }
}
function k(o){return clean(o["日期"])+"||"+clean(o["地點"])}
function isActiveSignup(s){
  const status=clean(s["狀態"]);
  return !status||status==="已報名";
}
function isTaskToday(t){
  const d=taskDate(t["日期"]);
  const today=taipeiToday();
  return !!d && d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate();
}
function render(){
  const root=document.getElementById("content");
  if(!tasks.length){root.innerHTML='<div class="card empty">目前沒有工作任務</div>';return}
  root.innerHTML=tasks.map(function(t,i){
    const people=signups.filter(function(s){return k(s)===k(t)});
    const opened=isTaskOpen(t);
    const openTime=clean(t["開放時間"]);
    const opts='<option value="">請選擇姓名</option>'+workers.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join("");
    const peopleHtml=people.length?people.map(function(p){return '<div class="person"><strong>'+esc(p["姓名"])+'</strong><span class="ptime">'+esc(p["可出勤到幾點"])+'</span></div>'}).join(""):'<div class="empty">目前尚無人登記</div>';
    return '<section class="card">'+
      '<div class="head"><div><div class="place">'+esc(t["地點"])+'</div><div class="meta">'+
      '<span class="pill">'+esc(t["日期"])+'</span>'+
      (t["時間"]?'<span class="pill">開始 '+esc(t["時間"])+'</span>':'')+
      (t["人數"]?'<span class="pill">需求 '+esc(t["人數"])+' 人</span>':'')+
      '</div></div></div>'+
      (!opened&&openTime?'<div class="locked">'+esc(openTime)+' 開放報名</div>':'')+
      '<hr><label>姓名</label><select id="name_'+i+'" onchange="syncExisting('+i+')" '+(!opened?'disabled':'')+'>'+opts+'</select>'+
      '<div id="hint_'+i+'" class="hint">如果之前已登記，重新選擇姓名即可修改時間</div>'+
      '<label>可出勤到幾點</label>'+
      '<select id="until_'+i+'" '+(!opened?'disabled':'')+'><option value="">請選擇時間</option>'+
      Array.from({length:48},function(_,n){
        const h=Math.floor(n/2);
        const m=n%2===0?"00":"30";
        const v=String(h).padStart(2,"0")+":"+m;
        return '<option value="'+v+'">'+v+'</option>';
      }).join("")+
      '</select>'+
      '<button class="btn" id="btn_'+i+'" onclick="submitSignup('+i+')" '+(!opened?'disabled':'')+'>'+(!opened?'尚未開放報名':'確認可以上班')+'</button>'+
      '<button class="cancel-btn" id="cancel_'+i+'" onclick="cancelSignup('+i+')">取消出勤</button>'+
      
      '</section>';
  }).join("");
}
function syncExisting(i){
  const t=tasks[i];
  const name=clean(document.getElementById("name_"+i).value);
  const untilEl=document.getElementById("until_"+i);
  const hint=document.getElementById("hint_"+i);
  const cancelBtn=document.getElementById("cancel_"+i);

  cancelBtn.style.display="none";

  if(!name){
    untilEl.value="";
    hint.textContent="如果之前已登記，重新選擇姓名即可修改時間";
    hint.className="hint";
    return;
  }

  const found=signups.find(function(s){
    return k(s)===k(t)&&clean(s["姓名"])===name;
  });

  if(found && isActiveSignup(found)){
    untilEl.value=clean(found["可出勤到幾點"]);
    if(isTaskToday(t)){
      hint.textContent="你已登記；今天如需取消，請聯絡正職人員";
      hint.className="hint active";
    }else{
      hint.textContent="你已登記，可修改時間或取消出勤";
      hint.className="hint active";
      cancelBtn.style.display="block";
    }
  }else if(found){
    untilEl.value="";
    hint.textContent="你之前已取消，可重新選擇時間後再次報名";
    hint.className="hint";
  }else{
    untilEl.value="";
    hint.textContent="尚未登記";
    hint.className="hint";
  }
}

async function submitSignup(i){
  const t=tasks[i];
  if(!isTaskOpen(t))return show((clean(t["開放時間"])||"指定時間")+" 後才開放報名","err");
  const name=clean(document.getElementById("name_"+i).value);
  const until=clean(document.getElementById("until_"+i).value);
  if(!name)return show("請先選擇姓名","err");
  if(!until)return show("請選擇可出勤時間","err");
  const btn=document.getElementById("btn_"+i);btn.disabled=true;btn.textContent="送出中…";
  try{
    await fetch(API,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"signup",date:clean(t["日期"]),place:clean(t["地點"]),name:name,until:until})
    });
    const existing=signups.some(function(s){
      return k(s)===k(t)&&clean(s["姓名"])===name;
    });
    show(existing?"已更新出勤時間":"已送出登記","ok");
    setTimeout(loadAll,1200);
  }catch(e){
    show("送出失敗，請再試一次","err");
  }finally{
    btn.disabled=false;btn.textContent="確認可以上班";
  }
}
async function cancelSignup(i){
  const t=tasks[i];
  const name=clean(document.getElementById("name_"+i).value);
  if(!name)return show("請先選擇姓名","err");
  if(isTaskToday(t))return show("工作當天無法自行取消，請聯絡正職人員","err");
  if(!confirm("確定要取消 "+clean(t["日期"])+" "+clean(t["地點"])+" 的出勤嗎？"))return;

  const btn=document.getElementById("cancel_"+i);
  btn.disabled=true;
  btn.textContent="取消中…";

  try{
    await fetch(API,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"cancel",
        date:clean(t["日期"]),
        place:clean(t["地點"]),
        name:name
      })
    });
    show("已取消出勤","ok");
    setTimeout(loadAll,1200);
  }catch(e){
    show("取消失敗，請再試一次","err");
  }finally{
    btn.disabled=false;
    btn.textContent="取消出勤";
  }
}

loadAll();
setInterval(loadAll,30000);
</script>
</body>
</html>
