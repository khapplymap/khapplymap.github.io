<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工讀排班</title>
<style>
body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:720px;margin:auto;padding:20px 14px 40px}h1{font-size:30px;margin:4px 0}.sub{color:#6b7280;margin-bottom:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.05)}.place{font-size:22px;font-weight:800}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.pill{background:#f3f4f6;padding:7px 10px;border-radius:999px;font-size:13px}label{display:block;font-weight:700;margin:12px 0 7px}select,input{width:100%;height:48px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:16px;background:white}.btn{width:100%;margin-top:14px;height:48px;border:0;border-radius:12px;background:#111827;color:white;font-size:16px;font-weight:800}.btn:disabled{opacity:.45}.notice{padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;color:#9a3412;margin-bottom:14px}.empty{color:#6b7280;text-align:center;padding:12px}
</style></head><body><main>
<h1>工讀排班</h1><div class="sub">選擇工作任務，登記你可以出勤到幾點</div>
<div class="notice">網站已上線；報名送出功能還差 Google Apps Script 一次授權部署。</div>
<div id="content"><div class="card empty">同步 Google Sheet 中…</div></div>
</main>
<script>
const id="1bcZ1ZzsKq7Ji_QYu9ahb_TMcZLcxowX8DWpio7ehOsI";
const clean=v=>String(v??"").trim();
async function sheet(name){
 const u="https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(name)+"&_="+Date.now();
 const r=await fetch(u); const t=await r.text(); const m=t.match(/setResponse\((.*)\);?\s*$/s); if(!m) throw Error("read");
 const j=JSON.parse(m[1]); const h=(j.table.cols||[]).map(c=>clean(c.label));
 return (j.table.rows||[]).map(row=>{const o={}; h.forEach((x,i)=>o[x]=row.c?.[i]?.f??row.c?.[i]?.v??""); return o});
}
async function load(){
 try{
  const [workers,tasks]=await Promise.all([sheet("工讀生名單"),sheet("工作任務")]);
  const names=workers.map(x=>clean(x["姓名"])).filter(Boolean);
  const opts='<option value="">請選擇姓名</option>'+names.map(n=>'<option>'+n+'</option>').join("");
  const list=tasks.filter(t=>clean(t["日期"])&&clean(t["地點"]));
  document.getElementById("content").innerHTML=list.length?list.map(t=>'<div class="card"><div class="place">'+clean(t["地點"])+'</div><div class="meta"><span class="pill">'+clean(t["日期"])+'</span>'+(clean(t["時間"])?'<span class="pill">開始 '+clean(t["時間"])+'</span>':'')+(clean(t["人數"])?'<span class="pill">需求 '+clean(t["人數"])+' 人</span>':'')+'</div><label>姓名</label><select>'+opts+'</select><label>可出勤到幾點</label><input type="time" step="900"><button class="btn" disabled>確認可以上班</button></div>').join(""):'<div class="card empty">目前沒有工作任務</div>';
 }catch(e){document.getElementById("content").innerHTML='<div class="card empty">目前無法讀取 Google Sheet</div>'}
}
load();
</script></body></html>
