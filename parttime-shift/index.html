<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工讀排班</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:760px;margin:auto;padding:22px 14px 44px}
h1{font-size:30px;margin:4px 0 2px}.sub{color:#6b7280;margin-bottom:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;color:#6b7280;font-size:14px}
.refresh{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.05)}
.head{display:flex;justify-content:space-between;gap:12px}.place{font-size:22px;font-weight:800}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.pill{background:#f3f4f6;padding:7px 10px;border-radius:999px;font-size:13px}
.count{font-size:14px;color:#6b7280;white-space:nowrap}
label{display:block;font-weight:700;margin:13px 0 7px}
select,input{width:100%;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:#111827;pointer-events:auto;opacity:1}
select{appearance:auto;-webkit-appearance:menulist}
input[type="time"]{-webkit-appearance:auto}
.btn{width:100%;margin-top:14px;height:50px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.person{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #eceff3;border-radius:12px;background:#fafafa;margin-top:7px}
.time{font-weight:800;color:#0f766e}.empty{color:#6b7280;text-align:center;padding:12px}
.notice{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px;border:1px solid #d1d5db;background:#fff}
hr{border:0;border-top:1px solid #e5e7eb;margin:16px 0}
@media(max-width:560px){main{padding:14px 12px 36px}h1{font-size:27px}.card{border-radius:18px;padding:16px}.place{font-size:20px}}
</style>
</head>
<body>
<main>
  <h1>工讀排班</h1>
  <div class="sub">選擇工作任務，登記你可以出勤到幾點</div>
  <div id="notice" class="notice"></div>
  <div class="toolbar">
    <span id="status">同步中…</span>
    <button class="refresh" onclick="loadAll()">重新整理</button>
  </div>
  <div id="content"><div class="card empty">同步 Google Sheet 中…</div></div>
</main>
<script>
const SHEET_ID="1bcZ1ZzsKq7Ji_QYu9ahb_TMcZLcxowX8DWpio7ehOsI";
const API="https://script.google.com/macros/s/AKfycbzUSzoGVLRCaqBjE4B8Hbmy-viUuYW7pQSB5mlRaxj-pkE96y8W6K3uls2djftrCKrSBg/exec";
let workers=[],tasks=[],signups=[];
const clean=v=>String(v??"").trim();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function show(msg){const n=document.getElementById("notice");n.textContent=msg;n.style.display="block";setTimeout(()=>n.style.display="none",2600)}
async function readSheet(name){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(name)+"&_="+Date.now();
  const r=await fetch(url,{cache:"no-store"});
  const t=await r.text();
  const start=t.indexOf("("),end=t.lastIndexOf(")");
  if(start<0||end<0)throw Error("無法讀取 "+name);
  const j=JSON.parse(t.slice(start+1,end));
  const labels=(j.table.cols||[]).map(c=>clean(c.label));
  return (j.table.rows||[]).map(row=>{
    const o={};
    (row.c||[]).forEach((cell,i)=>{
      const key=labels[i]||("_col"+i);
      o[key]=clean(cell?.f??cell?.v??"");
    });
    return o;
  });
}
function key(o){return clean(o["日期"])+"||"+clean(o["地點"])}
async function loadAll(){
  document.getElementById("status").textContent="同步中…";
  try{
    const [w,t,s]=await Promise.all([readSheet("工讀生名單"),readSheet("工作任務"),readSheet("報名紀錄")]);
    workers=w.map(row=>clean(row["姓名"]||row["_col0"]||Object.values(row)[0])).filter(Boolean);
    tasks=t.filter(row=>clean(row["日期"])&&clean(row["地點"]));
    signups=s.filter(row=>clean(row["姓名"]));
    render();
    document.getElementById("status").textContent="已同步 Google Sheet";
  }catch(e){
    document.getElementById("status").textContent="同步失敗";
    document.getElementById("content").innerHTML='<div class="card empty">目前無法讀取 Google Sheet</div>';
  }
}
function render(){
  const root=document.getElementById("content");
  if(!tasks.length){root.innerHTML='<div class="card empty">目前沒有工作任務</div>';return}
  root.innerHTML=tasks.map((t,i)=>{
    const people=signups.filter(x=>key(x)===key(t));
    const opts='<option value="">請選擇姓名</option>'+workers.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
    const peopleHtml=people.length?people.map(p=>'<div class="person"><strong>'+esc(p["姓名"])+'</strong><span class="time">'+esc(p["可出勤到幾點"])+'</span></div>').join(""):'<div class="empty">目前尚無人登記</div>';
    return '<section class="card">'+
      '<div class="head"><div><div class="place">'+esc(t["地點"])+'</div><div class="meta"><span class="pill">'+esc(t["日期"])+'</span>'+(clean(t["時間"])?'<span class="pill">開始 '+esc(t["時間"])+'</span>':'')+(clean(t["人數"])?'<span class="pill">需求 '+esc(t["人數"])+' 人</span>':'')+'</div></div><div class="count">已登記 '+people.length+(clean(t["人數"])?'/'+esc(t["人數"]):'')+'</div></div>'+
      '<hr><label>姓名</label><select id="name_'+i+'">'+opts+'</select>'+
      '<label>可出勤到幾點</label><input id="until_'+i+'" type="time" step="900">'+
      '<button id="btn_'+i+'" class="btn" onclick="submitSignup('+i+')">確認可以上班</button>'+
      '<hr><strong>目前可出勤人員</strong>'+peopleHtml+
      '</section>';
  }).join("");
}
async function submitSignup(i){
  const task=tasks[i];
  const name=clean(document.getElementById("name_"+i).value);
  const until=clean(document.getElementById("until_"+i).value);
  if(!name)return show("請先選擇姓名");
  if(!until)return show("請填寫可出勤到幾點");
  const btn=document.getElementById("btn_"+i);
  btn.disabled=true;btn.textContent="送出中…";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"signup",date:clean(task["日期"]),place:clean(task["地點"]),name,until})});
    const result=await r.json();
    if(!result.success)throw Error(result.error||"送出失敗");
    show("已完成登記");
    await loadAll();
  }catch(e){show(e.message||"送出失敗")}
  finally{btn.disabled=false;btn.textContent="確認可以上班"}
}
loadAll();
setInterval(loadAll,30000);
</script>
</body></html>
