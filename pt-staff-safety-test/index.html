<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工讀排班安全檢查｜測試版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172132}main{max-width:920px;margin:auto;padding:26px 16px 60px}.card{background:white;border:1px solid #e1e5ef;border-radius:17px;padding:20px;margin:15px 0;box-shadow:0 4px 16px #1a2b4a08}.pill{display:inline-block;border-radius:99px;background:#fff2db;padding:6px 10px;color:#995c00;font-weight:700}.muted{color:#667186}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}button{border:1px solid #b8c5d9;border-radius:10px;padding:11px 14px;background:white;font-weight:700;cursor:pointer}button.primary{background:#172b56;color:white;border-color:#172b56}button:disabled{opacity:.4}input{width:90px;padding:10px;border:1px solid #c4cfde;border-radius:9px;font:inherit}label{display:block;font-size:14px;margin:8px 0 4px}.danger{color:#b42318}.ok{color:#087c53}.note{background:#fff5e7;border:1px solid #f2d29a;border-radius:12px;padding:13px;margin-top:14px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px 7px;border-bottom:1px solid #e8eaf0;text-align:left}h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}small{color:#687386}@media(max-width:500px){th,td{font-size:12px;padding:9px 4px}}</style></head><body><main>
<div class="row"><div><h1>工讀排班｜公布安全檢查</h1><div class="muted">獨立測試環境 · 僅在瀏覽器模擬，不連接正式排程 API</div></div><span class="pill">測試版｜不會公布</span></div>
<div class="card"><h2>測試資料設定</h2><p class="muted">以兩校需求各 5 人為例。自行調整數字，模擬 18:00 檢查與 18:30 公布。</p><div class="grid"><div><label>學校 A 需求人數</label><input id="needA" type="number" min="0" max="99" value="5"><label>學校 A 男 / 女</label><input id="menA" type="number" min="0" value="1"> / <input id="womenA" type="number" min="0" value="4"></div><div><label>學校 B 需求人數</label><input id="needB" type="number" min="0" max="99" value="5"><label>學校 B 男 / 女</label><input id="menB" type="number" min="0" value="3"> / <input id="womenB" type="number" min="0" value="2"></div></div><div class="row" style="margin-top:16px"><button class="primary" id="checkBtn">模擬 18:00 檢查</button><button id="resetBtn">還原示範</button></div></div>
<div class="card"><h2>18:00 檢查結果</h2><div id="checks">請先按「模擬 18:00 檢查」。</div></div>
<div class="card"><h2>18:30 公布判定（模擬）</h2><p id="state">尚未檢查</p><div class="row"><button id="confirmBtn" disabled>管理者確認這次配置</button><button id="publishBtn" class="primary" disabled>模擬 18:30 公布</button></div><p class="muted">這裡的按鈕只改變測試畫面，不會呼叫正式 Apps Script 或更動試算表。</p></div>
<p class="muted">測試規則：人數不足僅警示，仍可公布；報名總數超過總需求需確認；兩校可透過同額交換改善男女比例時需確認。此處僅測試兩校簡化模型，不代表正式演算法已驗證。</p>
</main><script>
const ids=["needA","needB","menA","womenA","menB","womenB"];let hasChecked=false,needsConfirm=false,confirmed=false;
const v=id=>Math.max(0,Number(document.getElementById(id).value)||0);
function imbalance(a,b){const denA=a.m+a.w,denB=b.m+b.w;if(!denA||!denB)return 0;return Math.abs(a.m/denA-b.m/denB);}
function avoidable(a,b){const initial=imbalance(a,b);if(initial<0.001)return false;for(let am=-1;am<=1;am++){for(let aw=-1;aw<=1;aw++){if(am+aw!==0||am===0)continue;const x={m:a.m+am,w:a.w+aw},y={m:b.m-am,w:b.w-aw};if(x.m<0||x.w<0||y.m<0||y.w<0)continue;if(imbalance(x,y)<initial-0.001)return true;}}return false;}
function check(){const a={m:v("menA"),w:v("womenA")},b={m:v("menB"),w:v("womenB")};const total=a.m+a.w+b.m+b.w,need=v("needA")+v("needB");const warning=[];if(total>need)warning.push("超額報名 "+(total-need)+" 人：需要人工確認錄取與候補名單。");if(avoidable(a,b))warning.push("男女分配存在可避免的失衡：建議先調整各校人員。");const shortage=Math.max(0,need-total);if(shortage)warning.push("人力缺額 "+shortage+" 人：只提示，不阻止公布。");const schoolIssues=[];if(a.m+a.w>v("needA"))schoolIssues.push("學校 A 超出需求人數");if(b.m+b.w>v("needB"))schoolIssues.push("學校 B 超出需求人數");needsConfirm=total>need||avoidable(a,b)||schoolIssues.length>0;confirmed=false;hasChecked=true;
document.getElementById("checks").innerHTML='<p>報名 <b>'+total+'</b> 人，需求 <b>'+need+'</b> 人</p><table><tr><th>學校</th><th>需求</th><th>已分配</th><th>男 / 女</th></tr><tr><td>學校 A</td><td>'+v("needA")+'</td><td>'+(a.m+a.w)+'</td><td>'+a.m+' / '+a.w+'</td></tr><tr><td>學校 B</td><td>'+v("needB")+'</td><td>'+(b.m+b.w)+'</td><td>'+b.m+' / '+b.w+'</td></tr></table>'+[...warning,...schoolIssues].map(x=>'<div class="note">'+x+'</div>').join("")+(warning.length+schoolIssues.length?'':'<p class="ok">沒有發現需確認的條件。</p>');refresh();}
function refresh(){const state=document.getElementById("state"),c=document.getElementById("confirmBtn"),p=document.getElementById("publishBtn");c.disabled=!hasChecked||!needsConfirm||confirmed;p.disabled=!hasChecked||(needsConfirm&&!confirmed);state.innerHTML=!hasChecked?'尚未檢查':needsConfirm&&!confirmed?'<strong class="danger">需人工確認，暫停自動公布（測試）</strong>':confirmed?'<strong class="ok">已人工確認，可進行模擬公布</strong>':'<strong class="ok">檢查通過，可以模擬公布</strong>';}
document.getElementById("checkBtn").onclick=check;document.getElementById("confirmBtn").onclick=()=>{confirmed=true;refresh()};document.getElementById("publishBtn").onclick=()=>{document.getElementById("state").innerHTML='<strong class="ok">模擬公布成功（沒有寫入任何正式資料）</strong>';document.getElementById("publishBtn").disabled=true;};document.getElementById("resetBtn").onclick=()=>{[5,5,1,4,3,2].forEach((n,i)=>document.getElementById(ids[i]).value=n);hasChecked=false;confirmed=false;document.getElementById("checks").textContent="請先按「模擬 18:00 檢查」。";refresh()};ids.forEach(id=>document.getElementById(id).addEventListener("input",()=>{hasChecked=false;confirmed=false;refresh();document.getElementById("checks").textContent="數字已變更，請重新檢查。";}));
</script></body></html>
